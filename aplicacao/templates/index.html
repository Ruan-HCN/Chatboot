<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Filtro de Comentários</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="shortcut icon" href="../img/logo.svg" type="image/x-icon">
</head>
<body>

  <!-- Divisória preta -->
  <div class="top-bar"></div>

  <!-- Navbar branca -->
  <nav class="navbar">
    <div class="left">
      <span><a href="#">Edição do dia</a></span>
    </div>

    <div class="center">
      <img class="logo" src="img/logo.svg" alt="JC-PE">
    </div>

    <div class="right">
      <span class="icons">🔍 ☰</span>
    </div>
  </nav>

  <!-- Conteúdo principal -->
  <div class="container">

    <!-- Formulário -->
    <div class="form-container">
      <h1>Envie seu Comentário</h1>
      <p>Digite sua opinião e ela será filtrada automaticamente.</p>
      <div class="rainbow-line"></div>

      <label for="nome">Nome</label>
      <input type="text" id="nome" placeholder="Seu nome" required />
      <small id="contadorNome">0/50</small>

      <label for="mensagem">Mensagem</label>
      <textarea id="mensagem" placeholder="Digite sua mensagem..." required></textarea>
      <small id="contadorMensagem">0/200</small>

      <button id="botaoEnviar">Enviar comentário</button>

      <div class="rainbow-line"></div>
    </div>

    <!-- Resultado do comentário filtrado -->
    <div class="news-box">
      <h2>Comentário Filtrado</h2>
      <div id="comentarioFiltrado"></div>
    </div>

  </div>

  <script src="js/script.js"></script>
</body>
</html>
